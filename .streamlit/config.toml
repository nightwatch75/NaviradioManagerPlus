[global]
disableWidgetStateDuplicationWarning = false
showWarningOnDirectExecution = true

[client]
showErrorDetails = "none"
toolbarMode = "auto"

[server]
runOnSave = true
address = "0.0.0.0"
port = "8501"

[theme]
# Base dark; the light variant is applied by style.css (toggle in the sidebar)
base = "dark"
primaryColor = "#ff6b35"
font = "sans-serif"

[logger]
level = "info"
messageFormat = "%(asctime)s %(message)s"
